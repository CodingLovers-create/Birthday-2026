<div class="profile-main-container">
  <app-page-header title="Profile" (back)="goBack()">
    <button type="button" class="btn-logout-header" (click)="logout()">Logout</button>
  </app-page-header>

  <div class="profile-header-card">
    <img [src]="profileAvatar" [alt]="userDisplayName" class="avatar-img" />
    <h2 class="profile-name">{{ userDisplayName | capitalizeFirst | nameFormatter }}</h2>
  </div>

  <div class="stats-counter-bar">
    <div class="stat-item">
      {{ posts().length | numberRoundoff }} {{ posts().length === 1 ? 'Post' : 'Posts' }}
    </div>
    <div class="divider"></div>
    <div class="stat-item">{{ totalLikes | numberRoundoff }} Likes</div>
    <div class="divider"></div>
    <div class="stat-item">{{ totalShares | numberRoundoff }} Shares</div>
  </div>

  <p *ngIf="isLoading()" class="loading-state-text">Loading your posts…</p>

  <p *ngIf="!isLoading() && posts().length === 0" class="empty-state-text">
    You haven't posted any birthday wishes yet.
  </p>

  <div *ngIf="!isLoading() && posts().length > 0" class="posts-grid">
    <button
      type="button"
      *ngFor="let post of posts()"
      class="post-thumbnail-btn"
      (click)="openPost(post)"
    >
      <img [src]="post.images[0]" alt="Post thumbnail" class="thumb-img" />
    </button>
  </div>

  <!-- Logout Button Section -->
  <div class="logout-action-wrapper">
    <button type="button" class="btn-profile-logout" (click)="logout()">
      <svg class="logout-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
      </svg>
      <span>Logout</span>
    </button>
  </div>
</div>
