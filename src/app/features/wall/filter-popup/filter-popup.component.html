<div class="popup-modal-backdrop" (click)="requestClose()">
  <div class="popup-sheet-container" (click)="$event.stopPropagation()">
    <div class="sheet-title-row">
      <h3 class="popup-title">Filter</h3>
      <button type="button" class="close-icon-btn" (click)="requestClose()">✕</button>
    </div>

    <p class="section-label">Category</p>
    <div class="tags-chips-grid">
      <button
        *ngFor="let tag of tags"
        type="button"
        class="tag-chip-btn"
        [class.selected]="selectedTag === tag"
        (click)="pickTag(tag)"
      >
        {{ tag }}
      </button>
    </div>

    <div class="buttons-action-row">
      <div class="btn-col">
        <button
          type="button"
          class="btn-reset"
          [disabled]="!selectedTag"
          (click)="clearTag()"
        >
          Reset
        </button>
      </div>
      <div class="btn-col">
        <button type="button" class="btn-apply" (click)="applyFilter()">
          Apply
        </button>
      </div>
    </div>
  </div>
</div>

<app-confirm-dialog
  *ngIf="isExitConfirmOpen()"
  title="Discard changes?"
  message="You have unsaved filter changes."
  confirmLabel="Yes"
  cancelLabel="No"
  (confirm)="discardAndClose()"
  (cancel)="isExitConfirmOpen.set(false)"
></app-confirm-dialog>
