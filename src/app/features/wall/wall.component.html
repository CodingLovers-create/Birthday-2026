<div class="wall-main-container">
  <!-- Header -->
  <header class="wall-header">
    <h1 class="wall-title">Birthday Wall</h1>
  </header>

  <div *ngIf="isFilterApplied" class="filter-chip-bar">
    <span class="filter-tag-chip">{{ filter().tag }}</span>
    <button type="button" class="clear-filter-btn" (click)="resetFilter()">Clear</button>
  </div>

  <!-- Feed -->
  <main class="feed-container">
    <p *ngIf="isLoading()" class="loading-state-text">Loading the wall…</p>

    <p *ngIf="!isLoading() && posts().length === 0" class="empty-state-text">
      No posts match this filter yet.
    </p>

    <app-post-card
      *ngFor="let post of posts()"
      [post]="post"
      (updated)="onPostUpdated($event)"
      (report)="requestRemoval($event)"
      (delete)="requestRemoval($event)"
      (openComments)="activeCommentsPostId.set($event.postId)"
    ></app-post-card>

    <p *ngIf="isFetchingMore()" class="fetching-more-text">Loading more…</p>
  </main>

  <!-- Bottom bar: Filter / Sort / Profile -->
  <nav class="bottom-nav-bar">
    <button type="button" class="nav-btn" (click)="toggleFilter()">
      <span class="nav-icon" [ngClass]="{ 'active-brand': isFilterApplied }">⚙</span>
      <span class="nav-label">Filter</span>
    </button>

    <div class="divider"></div>

    <button type="button" class="nav-btn" (click)="toggleSort()">
      <span class="nav-icon" [ngClass]="{ 'active-brand': isSortApplied }">↕</span>
      <span class="nav-label">Sort</span>
    </button>

    <div class="divider"></div>

    <button type="button" class="nav-btn" (click)="goToProfile()">
      <img [src]="profilePic" alt="Profile" class="profile-avatar-img" />
      <span class="nav-label">Profile</span>
    </button>
  </nav>
</div>

<app-filter-popup
  *ngIf="isFilterOpen()"
  [filter]="filter()"
  (apply)="applyFilter($event)"
  (close)="isFilterOpen.set(false)"
></app-filter-popup>

<app-sort-popup
  *ngIf="isSortOpen()"
  [selected]="filter().sort"
  (select)="applySort($event)"
  (close)="isSortOpen.set(false)"
></app-sort-popup>

<app-comment-section
  *ngIf="activeCommentsPostId() as postId"
  [postId]="postId"
  (close)="activeCommentsPostId.set(null)"
></app-comment-section>

<app-confirm-dialog
  *ngIf="postPendingRemoval() as post"
  [title]="post.isMine ? 'Delete this post?' : 'Report this post?'"
  [message]="post.isMine ? 'This will remove your post from the wall.' : 'We will remove this post from your feed.'"
  [confirmLabel]="post.isMine ? 'Delete' : 'Report'"
  (confirm)="confirmRemoval()"
  (cancel)="cancelRemoval()"
></app-confirm-dialog>
