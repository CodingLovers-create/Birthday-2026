<div class="sort-popup-overlay" (click)="close.emit()">
  <div class="sort-popup-card" (click)="$event.stopPropagation()">
    <div class="sort-header">
      <h3 class="sort-title">Sort By</h3>
      <button type="button" class="close-btn" (click)="close.emit()">✕</button>
    </div>

    <button
      *ngFor="let option of options"
      type="button"
      class="sort-option-btn"
      (click)="chooseOption(option.value)"
    >
      <span class="option-label" [class.active]="selected() === option.value">
        {{ option.label }}
      </span>
      <span *ngIf="selected() === option.value" class="checkmark">✓</span>
    </button>
  </div>
</div>
