<div class="comment-modal-backdrop" (click)="close.emit()">
  <div class="comment-modal-sheet" (click)="$event.stopPropagation()">
    <header class="sheet-header">
      <div class="sheet-handle"></div>
      <div class="header-content-row">
        <h3 class="sheet-title">Comments</h3>
        <button type="button" class="close-btn" (click)="close.emit()">✕</button>
      </div>
    </header>

    <div class="comments-list-body">
      <p *ngIf="isLoading()" class="empty-state-text">Loading comments…</p>

      <p *ngIf="!isLoading() && comments().length === 0" class="empty-state-text">
        No comments yet. Add a comment!
      </p>

      <div *ngFor="let comment of comments()" class="comment-item-row">
        <img [src]="comment.tinyProfilePic" [alt]="comment.commentBy" class="commenter-avatar" />
        <div class="comment-main">
          <p class="commenter-name">{{ comment.commentBy | capitalizeFirst | nameFormatter }}</p>
          <p class="comment-text-body">{{ comment.comment }}</p>
        </div>
        <div class="like-wrapper">
          <button type="button" class="like-btn" [class.liked]="comment.likeByMe" (click)="toggleLike(comment.id)">
            {{ comment.likeByMe ? '♥' : '♡' }}
          </button>
          <span class="likes-count">{{ comment.likescount > 0 ? comment.likescount : '' }}</span>
        </div>
      </div>
    </div>

    <footer class="sheet-footer">
      <img src="https://i.pravatar.cc/100?img=12" alt="You" class="user-avatar" />
      <input
        type="text"
        [(ngModel)]="newCommentText"
        (keyup.enter)="submitComment()"
        placeholder="Add a comment"
        maxlength="200"
        class="comment-input-field"
      />
      <button
        type="button"
        class="submit-post-btn"
        [disabled]="!newCommentText.trim() || isPosting()"
        (click)="submitComment()"
      >
        Post
      </button>
    </footer>
  </div>
</div>
