<div class="main-dashboard-container">

  <!-- Header (Standardized across all pages) -->
  <app-page-header title="Seva Sankalp Abhiyan" (back)="goBack()"></app-page-header>

  <!-- Hero Section -->
  <section class="hero-section">
    <div class="title-wrapper">
      <span class="star pink-star">✦</span>
      <h2 class="hero-title">Jan Seva</h2>
    </div>
    <div class="subtitle-wrapper">
      <span class="hi-text">Hi</span>
      <span class="prabhu-text">Prabhu Seva</span>
      <span class="star dark-star">✦</span>
    </div>
  </section>

  <!-- Banner Card 1: Seva Mera Yogdan (Image Asset) -->
  <div (click)="goToCreatePost('Seva Mera Yogdan')" class="banner-card">
    <img src="assets/images/banner_seva_mera_yogdan.png" alt="Seva Mera Yogdan" class="banner-img" />
  </div>

  <!-- Cards Grid (2 Columns, Side-by-Side Tile Layouts) -->
  <div class="cards-grid">
    <!-- Tile 1: AI Shubhkamna (Image Asset) -->
    <div (click)="goToCreatePost('AI Shubhkamna')" class="grid-tile">
      <img src="assets/images/tile_ai_shubhkamna.png" alt="AI Shubhkamna" class="tile-img" />
    </div>

    <!-- Tile 2: Aashirwad Ka Diya (Image Asset) -->
    <div (click)="goToCreatePost('Aashirwad Ka Diya')" class="grid-tile">
      <img src="assets/images/tile_aashirwad_ka_diya.png" alt="Aashirwad Ka Diya" class="tile-img" />
    </div>

    <!-- Tile 3: Seva Ke Rang, Rashtra Ke Sang (Image Asset) -->
    <div (click)="goToCreatePost('Seva Ke Rang, Rashtra Ke Sang')" class="grid-tile">
      <img src="assets/images/tile_seva_ke_rang.png" alt="Seva Ke Rang, Rashtra Ke Sang" class="tile-img" />
    </div>

    <!-- Tile 4: Seva Ki Kahani (Image Asset) -->
    <div (click)="goToCreatePost('Seva Ki Kahani')" class="grid-tile">
      <img src="assets/images/tile_seva_ki_kahani.png" alt="Seva Ki Kahani" class="tile-img" />
    </div>
  </div>

  <!-- Bottom Link: Explore Media Wall -->
  <div class="bottom-link-container">
    <button (click)="goToWall()" class="wall-link-btn">
      <span>Explore</span>
      <span class="underlined-text">Media wall</span>
      <span class="arrow-icon">↗</span>
    </button>
  </div>

</div>
