<div class="full-screen-banner-container">
  <!-- Full Screen Single Banner Container (No Header) -->
  <div class="hero-image-wrapper" (click)="onBannerClick(banners[0])">
    <!-- Banner Image filling 100% height -->
    <img src="assets/images/seva_sankalp_banner_full.jpg" alt="Seva Sankalp Abhiyan Banner" class="banner-full-img" />

    <!-- Button ON the banner -->
    <div class="banner-btn-overlay">
      <button class="btn-participate-now">
        <span>Participate Now</span>
        <svg class="arrow-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3" />
        </svg>
      </button>
    </div>
  </div>
</div>
