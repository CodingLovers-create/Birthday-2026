<div class="dialog-backdrop" (click)="cancel.emit()">
  <div
    class="dialog-card"
    (click)="$event.stopPropagation()"
  >
    <p class="dialog-title">{{ title() }}</p>
    <p class="dialog-message" *ngIf="message()">{{ message() }}</p>

    <div class="dialog-actions">
      <div class="action-col">
        <button
          type="button"
          class="btn-confirm"
          (click)="confirm.emit()"
        >
          {{ confirmLabel() }}
        </button>
      </div>
      <div class="action-col">
        <button
          type="button"
          class="btn-cancel"
          (click)="cancel.emit()"
        >
          {{ cancelLabel() }}
        </button>
      </div>
    </div>
  </div>
</div>
