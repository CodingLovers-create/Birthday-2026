<header class="page-header-navbar">
  <button *ngIf="showBack()" type="button" class="back-btn" (click)="back.emit()">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="back-icon">
      <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5" />
    </svg>
  </button>
  <h1 class="header-title">
    {{ title() }}
  </h1>
  <div class="right-content">
    <ng-content></ng-content>
  </div>
</header>
